name: CI Pipeline

env:
  workingDirScripts:  ./scripts/
  workingDirAgents:  ./agents/

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        agent_name: [agent1, agent2, agent3, agent4]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install docker

      - name: Build agents
        run: |
          docker build -t self-healing-system-${{ matrix.agent_name }} ${{ github.workspace }}/agents/${{ matrix.agent_name }}
      
      - name: Run build agents
        run: |
          docker run -v ${{ github.workspace }}/scripts self-healing-system

      - name: Run monitor script (test mode)
        run: |
          python ${{ github.workspace }}/scripts/monitor.py --once
