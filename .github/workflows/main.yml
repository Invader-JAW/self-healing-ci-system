name: CI Pipeline

env:
  workingDirScripts:  ./scripts/
  workingDir:  .

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install docker

      - name: Build agents
        run: |
          docker build -t self-healing-system ${{ env.workingDir }}/agents/Dockerfile
          docker run self-healing-system

      - name: Run monitor script (test mode)
        run: |
          python ${{ env.workingDirScripts }}/monitor.py --once
